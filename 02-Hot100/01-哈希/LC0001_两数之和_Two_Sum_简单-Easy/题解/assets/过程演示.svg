<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230"><rect width="900" height="230" rx="18" fill="#f3f6fa"/><text x="30" y="45" fill="#172b4d" font-size="25" font-family="sans-serif">哈希查找示例</text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="12s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 1 / 4</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">nums=[2,7,11,15]，target=9</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="12s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 2 / 4</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">读取2，寻找7；尚未出现，将2的位置存入表</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="12s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 3 / 4</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">读取7，寻找2；表中记录2位于下标0</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="12s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 4 / 4</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">返回下标0和1；先查询，再保存当前元素</text></g></svg>