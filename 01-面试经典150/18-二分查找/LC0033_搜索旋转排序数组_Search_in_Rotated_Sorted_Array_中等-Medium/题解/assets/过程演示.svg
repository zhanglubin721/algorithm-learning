<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230"><rect width="900" height="230" rx="18" fill="#f3f6fa"/><text x="30" y="45" fill="#172b4d" font-size="25" font-family="sans-serif">旋转数组二分示例</text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;1" keyTimes="0.0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1.0" dur="18s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 1 / 6</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">数组[4,5,6,7,0,1,2]，查找0</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0" keyTimes="0.0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1.0" dur="18s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 2 / 6</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">left=0，right=6，mid=3，值为7</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0" keyTimes="0.0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1.0" dur="18s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 3 / 6</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">左半段有序，0不在[4,7)中，移到右半段</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0" keyTimes="0.0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1.0" dur="18s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 4 / 6</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">left=4，right=6，mid=5，值为1</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0" keyTimes="0.0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1.0" dur="18s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 5 / 6</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">0位于有序区间[0,1)，收缩到left=right=4</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;0" keyTimes="0.0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1.0" dur="18s" repeatCount="indefinite"/><text x="30" y="105" font-size="20" fill="#2463a5" font-family="sans-serif">步骤 6 / 6</text><text x="30" y="157" font-size="20" fill="#172b4d" font-family="sans-serif">找到0，返回下标4</text></g></svg>